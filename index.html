<title>Bestellung</title>
<style>
  :root{
    --bg:#EDEFEA; --ink:#18231F; --muted:#6B766F; --line:#D3D8D0; --card:#fff;
    --green:#1E3B30; --amber:#C9891A; --amber-soft:#F6E7C6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
  header h1{margin:0;font-size:22px;font-weight:700}
  .hr{display:flex;align-items:center;gap:14px}
  .hbtn{background:none;border:0;color:var(--amber-soft);font-size:15px;font-weight:600;padding:6px 0;touch-action:manipulation}
  #reset.armed{color:#fff;background:#A5392B;border-radius:8px;padding:6px 10px}
  #cfg{display:grid;gap:10px;margin-top:12px}
  #cfg[hidden]{display:none}
  #cfg label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--amber-soft)}
  #cfg select{font:inherit;font-size:16px;height:44px;border:0;border-radius:8px;padding:0 10px;background:#fff;color:var(--ink);width:100%}
  .cols,.row{display:grid;grid-template-columns:76px 1fr 60px 78px 22px;gap:6px;align-items:center}
  .cols{padding:8px 16px 4px;font-size:12px;font-weight:600;color:var(--muted)}
  .cols span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cols span:nth-child(3),.cols span:nth-child(4){text-align:right}
  main{padding:4px 10px 24px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px}
  .row.active{border-color:var(--amber);background:#FFFDF7}
  .stepper{display:flex;align-items:stretch;gap:3px;height:46px}
  .count{width:42px;text-align:center;font-size:22px;font-weight:700;border:0;border-radius:8px;
    background:var(--bg);color:var(--ink);padding:0;min-width:0}
  .arrows{display:flex;flex-direction:column;gap:2px;width:28px}
  .arrows button{flex:1;border:0;border-radius:6px;background:var(--amber-soft);color:var(--green);
    font-size:11px;padding:0;touch-action:manipulation}
  .arrows button:active{background:var(--amber)}
  input{font:inherit;color:var(--ink);outline:none}
  .name{height:46px;border:0;background:transparent;font-size:16px;padding:0 4px;min-width:0;width:100%}
  .name::placeholder,.price::placeholder{color:var(--muted)}
  .price{height:46px;border:0;border-radius:8px;background:var(--bg);font-size:16px;text-align:right;padding:0 6px;min-width:0;width:100%}
  .sum{text-align:right;font-weight:700;font-size:15px;white-space:nowrap;min-width:0}
  .sum.zero{color:var(--muted);font-weight:400}
  .del{background:none;border:0;color:var(--muted);font-size:14px;height:46px;padding:0}
  #add{width:100%;margin-top:4px;padding:14px;border:1.5px dashed var(--amber);border-radius:10px;
    background:transparent;color:var(--amber);font-size:16px;font-weight:700}
  footer{position:sticky;bottom:0;background:var(--green);color:#fff;display:flex;justify-content:space-between;
    align-items:center;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
  footer .l{font-size:18px;font-weight:600}
  footer .s{font-size:13px;color:var(--amber-soft);margin-top:2px}
  footer .t{font-size:30px;font-weight:800;text-align:right}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 data-i="title"></h1>
    <div class="hr">
      <button class="hbtn" id="cfgBtn" aria-haspopup="true"></button>
      <button class="hbtn" id="reset"></button>
    </div>
  </div>
  <div id="cfg" hidden>
    <label><span data-i="lang"></span><select id="langSel"></select></label>
    <label><span data-i="cur"></span><select id="curSel"></select></label>
  </div>
</header>
<div class="cols"><span data-i="qty"></span><span data-i="product"></span><span data-i="price"></span><span data-i="sum"></span><span></span></div>
<main>
  <div id="list"></div>
  <button id="add" data-i="add"></button>
</main>
<footer>
  <div><div class="l" data-i="total"></div><div class="s" id="pieces"></div></div>
  <div class="t" id="total"></div>
</footer>

<script>

function detectDefault(){
  const nav = (navigator.language || 'de').toLowerCase();
  let l = LANGS.find(x => x.id.toLowerCase() === nav) ||
          LANGS.find(x => x.loc.toLowerCase() === nav) ||
          LANGS.find(x => x.id.toLowerCase() === nav.split('-')[0]) ||
          LANGS.find(x => x.loc.toLowerCase().startsWith(nav.split('-')[0] + '-'));
  l = l || LANGS[0];
  return {lang: l.id, cur: l.cur};
}
let S = detectDefault();
try {
  const raw = localStorage.getItem(SKEY);
  const s = raw && JSON.parse(raw);
  if (s && LANGS.some(x => x.id === s.lang) && CURS.includes(s.cur)) S = s;
} catch(e) {}
const L = () => LANGS.find(x => x.id === S.lang) || LANGS[0];
const t = k => (T[L().d] || T.en)[KEYS.indexOf(k)];
function saveSettings(){ try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch(e) {} }

let nfCur, nfZero = '0,00';
function mkFormats(){
  try { nfCur = new Intl.NumberFormat(L().loc, {style:'currency', currency:S.cur, currencyDisplay:'narrow'}); }
  catch(e) { nfCur = new Intl.NumberFormat(L().loc, {style:'currency', currency:S.cur}); }
  nfZero = new Intl.NumberFormat(L().loc, {minimumFractionDigits:2, maximumFractionDigits:2}).format(0);
}
const fmt = n => nfCur.format(n);

function curLabel(code){
  let name = '';
  try { name = new Intl.DisplayNames([L().loc], {type:'currency'}).of(code) || ''; } catch(e) {}
  return name && name !== code ? code + ' – ' + name : code;
}

// ---------- Daten ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const newItem = () => ({id: uid(), count: 0, name: '', price: ''});
const parsePrice = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; };
const lineTotal = it => Math.round(it.count * parsePrice(it.price) * 100) / 100;

let items = [newItem()];
const listEl = document.getElementById('list');

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e) {} }, 300);
}

function updateTotals(){
  let tot = 0, p = 0;
  items.forEach(it => { tot += lineTotal(it); p += it.count; });
  document.getElementById('total').textContent = fmt(Math.round(tot*100)/100);
  document.getElementById('pieces').textContent = t('pieces') + ': ' + p;
}

function updateRow(it, el){
  const total = lineTotal(it);
  const sum = el.querySelector('.sum');
  const txt = total === 0 ? '–' : fmt(total);
  sum.textContent = txt;
  sum.style.fontSize = txt.length > 11 ? '11px' : txt.length > 9 ? '12.5px' : '';
  sum.classList.toggle('zero', total === 0);
  el.classList.toggle('active', it.count > 0);
  updateTotals();
  save();
}

function buildRow(it){
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = `
    <div class="stepper">
      <input class="count" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3">
      <div class="arrows">
        <button type="button" class="up" aria-label="+1">▲</button>
        <button type="button" class="down" aria-label="−1">▼</button>
      </div>
    </div>
    <input class="name" type="text" autocomplete="off" autocapitalize="sentences">
    <input class="price" type="text" inputmode="decimal">
    <div class="sum zero">–</div>
    <button type="button" class="del">✕</button>`;
  const count = el.querySelector('.count');
  const name = el.querySelector('.name');
  const price = el.querySelector('.price');
  count.setAttribute('aria-label', t('qty'));
  name.placeholder = t('product');
  price.placeholder = nfZero;
  price.setAttribute('aria-label', t('price'));
  el.querySelector('.del').setAttribute('aria-label', t('del'));
  count.value = it.count; name.value = it.name; price.value = it.price;

  const setCount = n => { it.count = Math.max(0, Math.min(999, n)); count.value = it.count; updateRow(it, el); };
  el.querySelector('.up').onclick = () => setCount(it.count + 1);
  el.querySelector('.down').onclick = () => setCount(it.count - 1);
  count.oninput = () => { const n = parseInt(count.value.replace(/\D/g,''), 10); it.count = isFinite(n) ? n : 0; updateRow(it, el); };
  count.onblur = () => { count.value = it.count; };
  count.onfocus = () => count.select();
  name.oninput = () => { it.name = name.value; save(); };
  price.oninput = () => { price.value = price.value.replace(/[^0-9.,]/g, ''); it.price = price.value; updateRow(it, el); };
  price.onfocus = () => price.select();
  el.querySelector('.del').onclick = () => {
    items = items.filter(x => x.id !== it.id);
    if (!items.length) items = [newItem()];
    render(); save();
  };
  listEl.appendChild(el);
  updateRow(it, el);
  return el;
}

function render(){
  listEl.innerHTML = '';
  items.forEach(buildRow);
  updateTotals();
}

// ---------- Sprache anwenden ----------
const langSel = document.getElementById('langSel');
const curSel = document.getElementById('curSel');
const resetBtn = document.getElementById('reset');
const cfgBtn = document.getElementById('cfgBtn');

function fillSelects(){
  langSel.innerHTML = LANGS.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  langSel.value = S.lang;
  curSel.innerHTML = CURS.map(c => `<option value="${c}">${curLabel(c)}</option>`).join('');
  curSel.value = S.cur;
}
function applyI18n(){
  mkFormats();
  document.documentElement.lang = L().loc;
  document.title = t('title');
  document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
  cfgBtn.textContent = '🌐 ' + S.cur;
  disarm();
  fillSelects();
  render();
}

langSel.onchange = () => {
  S.lang = langSel.value;
  S.cur = L().cur;          // Standardwährung der Sprache, jederzeit änderbar
  saveSettings(); applyI18n();
};
curSel.onchange = () => { S.cur = curSel.value; saveSettings(); applyI18n(); };
cfgBtn.onclick = () => { const c = document.getElementById('cfg'); c.hidden = !c.hidden; };

document.getElementById('add').onclick = () => {
  const it = newItem(); items.push(it);
  const el = buildRow(it);
  el.querySelector('.name').focus();
  el.scrollIntoView({block:'center', behavior:'smooth'});
};

let armTimer;
resetBtn.onclick = () => {
  if (!resetBtn.classList.contains('armed')) {
    resetBtn.classList.add('armed'); resetBtn.textContent = t('sure');
    armTimer = setTimeout(disarm, 3000);
    return;
  }
  disarm(); items = [newItem()]; render(); save();
};
function disarm(){ clearTimeout(armTimer); resetBtn.classList.remove('armed'); resetBtn.textContent = t('reset'); }

try {
  const raw = localStorage.getItem(KEY);
  const saved = raw && JSON.parse(raw);
  if (Array.isArray(saved) && saved.length) items = saved;
} catch(e) {}
applyI18n();
</script>
